name: GSC-001 evidence candidate admission checks
on:
  pull_request:
    paths: ['pkg/gsc001/**','.github/workflows/gsc001-evidence-admission.yml']
  push:
    branches: [genesis]
    paths: ['pkg/gsc001/**','.github/workflows/gsc001-evidence-admission.yml']
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./pkg/gsc001 -v
